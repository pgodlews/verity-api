name: "Verity API contract tests"
description: "Run a Verity project (verity) and fail the job on assertion/transport failures."
author: "Verity"

inputs:
  project:
    description: "Path to the Verity project file (YAML or JSON)."
    required: true
  env:
    description: "Environment name to select (--env). Empty uses the project default."
    required: false
    default: ""
  parallel:
    description: "Max concurrent cases per suite (--parallel)."
    required: false
    default: "1"
  junit:
    description: "Path to write JUnit XML (optional)."
    required: false
    default: ""
  json:
    description: "Path to write the structured JSON result (optional)."
    required: false
    default: ""
  html:
    description: "Path to write an HTML report (optional)."
    required: false
    default: ""
  vars:
    description: "Variable overrides, one KEY=VALUE per line (values may contain spaces). Pass secrets through job environment variables instead."
    required: false
    default: ""
  suite:
    description: "Suites to run, one name or glob per line (--suite). Empty runs all."
    required: false
    default: ""
  case:
    description: "Cases to run, one name or glob per line (--case). Empty runs all."
    required: false
    default: ""
  bail:
    description: "Set to true to stop scheduling new cases after the first failure (--bail)."
    required: false
    default: "false"
  env-file:
    description: "Dotenv files to load, one path per line (--env-file)."
    required: false
    default: ""
  plugins:
    description: "Path to a plugins config JSON (optional); naming it trusts it."
    required: false
    default: ""
  trust-plugins:
    description: "Set to true to run the project's own .verity/plugins.json (--trust-plugins)."
    required: false
    default: "false"
  go-version:
    description: "Go version used to build verity from source."
    required: false
    default: "1.26"

runs:
  using: "composite"
  steps:
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: ${{ inputs.go-version }}

    - name: Build verity
      shell: bash
      run: go build -o "$RUNNER_TEMP/verity" ./cmd/verity
      working-directory: ${{ github.action_path }}/../../..

    - name: Run Verity
      shell: bash
      # Inputs reach the script only as environment variables, never as text
      # interpolated into it, so quotes or $(...) in an input cannot run.
      env:
        IN_PROJECT: ${{ inputs.project }}
        IN_ENV: ${{ inputs.env }}
        IN_PARALLEL: ${{ inputs.parallel }}
        IN_JUNIT: ${{ inputs.junit }}
        IN_JSON: ${{ inputs.json }}
        IN_HTML: ${{ inputs.html }}
        IN_PLUGINS: ${{ inputs.plugins }}
        IN_VARS: ${{ inputs.vars }}
        IN_SUITE: ${{ inputs.suite }}
        IN_CASE: ${{ inputs.case }}
        IN_BAIL: ${{ inputs.bail }}
        IN_ENV_FILE: ${{ inputs.env-file }}
        IN_TRUST_PLUGINS: ${{ inputs.trust-plugins }}
      run: |
        set -euo pipefail
        ARGS=(run "$IN_PROJECT")
        [ -n "$IN_ENV" ]      && ARGS+=(--env "$IN_ENV")
        [ -n "$IN_PARALLEL" ] && ARGS+=(--parallel "$IN_PARALLEL")
        [ -n "$IN_JUNIT" ]    && ARGS+=(--junit "$IN_JUNIT")
        [ -n "$IN_JSON" ]     && ARGS+=(--json "$IN_JSON")
        [ -n "$IN_HTML" ]     && ARGS+=(--html "$IN_HTML")
        [ -n "$IN_PLUGINS" ]  && ARGS+=(--plugins "$IN_PLUGINS")
        [ "$IN_BAIL" = true ] && ARGS+=(--bail)
        [ "$IN_TRUST_PLUGINS" = true ] && ARGS+=(--trust-plugins)
        # One value per line; blank lines are ignored.
        add_lines() {
          local flag=$1 text=$2 line
          while IFS= read -r line || [ -n "$line" ]; do
            line="${line%$'\r'}"
            if [ -n "${line//[[:space:]]/}" ]; then ARGS+=("$flag" "$line"); fi
          done <<< "$text"
          return 0
        }
        add_lines --var "$IN_VARS"
        add_lines --suite "$IN_SUITE"
        add_lines --case "$IN_CASE"
        add_lines --env-file "$IN_ENV_FILE"
        "$RUNNER_TEMP/verity" "${ARGS[@]}"
