name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
      - name: Test the patched WebView2 dependency
        working-directory: gui/third_party/go-webview2
        run: go test ./... -count=1
      - name: Test Windows Git process handling (includes the console and cancellation regressions)
        run: go test ./core/vcs ./core/workspace -count=1 -timeout=10m
      - name: Vet Windows core packages
        run: go vet ./core/vcs ./core/workspace
      - name: Test Windows desktop backend
        working-directory: gui
        run: go vet ./...; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; go test ./...
      - name: Build Windows desktop
        working-directory: gui
        run: go build -trimpath -tags production -ldflags=-H=windowsgui -o verity-desktop.exe .

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
      - name: Formatting
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - name: Module tidiness (every module)
        run: |
          for m in . gui plugins/grpc plugins/example-assertion gui/third_party/go-webview2; do
            echo "go mod tidy -diff in $m"
            (cd "$m" && go mod tidy -diff) || exit 1
          done
      - name: Vet
        run: go vet ./...
      - name: Staticcheck (every module)
        run: |
          for m in . gui plugins/grpc plugins/example-assertion; do
            echo "staticcheck in $m"
            (cd "$m" && go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...) || exit 1
          done
      - name: Govulncheck (root, desktop, and gRPC modules)
        run: |
          for m in . gui plugins/grpc; do
            echo "govulncheck in $m"
            (cd "$m" && go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...) || exit 1
          done
      - name: Test (core + CLI, race detector)
        run: go test -race ./...
      - name: Build CLI
        run: go build -o verity ./cmd/verity
      - name: Test the example plugin (own module)
        working-directory: plugins/example-assertion
        run: go vet ./... && go test ./... && go build -o example-assertion .
      - name: Test the gRPC plugin (own module, race detector)
        working-directory: plugins/grpc
        run: go vet ./... && go test ./... && go test -race ./...
      - name: Test the desktop backend (own module)
        working-directory: gui
        run: go vet ./... && go test ./...

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
      - name: Vet and test (core + CLI)
        run: go vet ./... && go test ./...
      - name: Test the desktop backend (own module)
        working-directory: gui
        run: go vet ./... && go test ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Build
        run: npx vite build

  example-run:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
      - name: Start mock server on a free port
        id: mock
        run: |
          go build -o "$RUNNER_TEMP/mockserver" ./examples/local-demo/mockserver
          "$RUNNER_TEMP/mockserver" --addr 127.0.0.1:0 > "$RUNNER_TEMP/mock.log" 2>&1 &
          addr=""
          for _ in $(seq 1 100); do
            addr=$(sed -n 's/.*mockserver listening on //p' "$RUNNER_TEMP/mock.log")
            if [ -n "$addr" ] && curl -s -o /dev/null "http://$addr/json"; then break; fi
            addr=""
            sleep 0.2
          done
          if [ -z "$addr" ]; then cat "$RUNNER_TEMP/mock.log"; exit 1; fi
          echo "base_url=http://$addr" >> "$GITHUB_OUTPUT"
      - name: Run Verity project via composite action
        uses: ./.github/actions/verity
        with:
          project: examples/local-demo/project.yaml
          env: local
          vars: BASE_URL=${{ steps.mock.outputs.base_url }}
          junit: reports/junit.xml
          json: reports/result.json
          html: reports/report.html
        env:
          # A throwaway value the local demo server expects; not a credential.
          API_TOKEN: super-secret-token-abc123456
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verity-reports
          path: reports/
