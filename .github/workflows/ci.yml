name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Formatting
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Test (core + CLI, race detector)
        run: go test -race ./...
      - name: Build CLI
        run: go build -o verity ./cmd/verity
      - name: Build example plugin (own module)
        working-directory: plugins/example-assertion
        run: go build -o example-assertion .
      - name: Test the gRPC plugin (own module)
        working-directory: plugins/grpc
        run: go vet ./... && go test ./...
      - name: Test the desktop backend (own module)
        working-directory: gui
        run: go vet . && go test .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Build
        run: npx vite build

  example-run:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Start mock server
        run: |
          go run ./examples/local-demo/mockserver --addr 127.0.0.1:8099 &
          sleep 2
      - name: Run Verity project via composite action
        uses: ./.github/actions/verity
        with:
          project: examples/local-demo/project.yaml
          env: local
          junit: reports/junit.xml
          json: reports/result.json
          html: reports/report.html
        env:
          # A throwaway value the local demo server expects; not a credential.
          API_TOKEN: super-secret-token-abc123456
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verity-reports
          path: reports/
